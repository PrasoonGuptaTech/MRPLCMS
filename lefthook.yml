pre-push:
  parallel: false
  jobs:
    - name: Full quality gate
      run: npm run validate

pre-commit:
  parallel: false
  jobs:
    - name: Format staged files
      run: npx prettier --write {staged_files}
      glob: '*.{js,json,ts,tsx,jsx,css,scss,md,yml,yaml}'
      stage_fixed: true

    - name: Check staged whitespace and conflict markers
      run: git diff --cached --check

    - name: Lint staged files
      run: npx eslint --max-warnings=0 {staged_files}
      glob: '*.{js,ts,tsx,jsx}'

    - name: Type-check project
      run: npm run typecheck
      glob: '*.{ts,tsx}'

    - name: Test related files
      run: npx jest --runInBand --no-watchman --passWithNoTests --findRelatedTests {staged_files}
      glob: '*.{js,ts,tsx,jsx}'

commit-msg:
  jobs:
    - name: Validate Conventional Commit message
      run: npx commitlint --edit {1}
