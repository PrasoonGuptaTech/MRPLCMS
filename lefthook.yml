pre-push:
  parallel: false
  jobs:
    - name: Validate branch
      run: npm run validate

pre-commit:
  parallel: false
  jobs:
    - name: Formatting Files
      run: |
        npx prettier --write {staged_files}
        git add {staged_files}
      glob: '*.{js,json,ts,tsx,jsx,css,scss,md,yml,yaml}'

    - name: Check Merge Conflicts
      run: |
        if git diff --check; then
          exit 0
        else
          echo "Merge Conflicts detected"
          exit 1
        fi

    - name: eslint
      run: npx eslint "{staged_files}"
      glob: '*.{js,ts,tsx,jsx}'

    - name: typecheck
      run: npx tsc --noEmit
      glob: '*.{ts,tsx}'

commit-msg:
  jobs:
    - name: Validate Commit message
      run: node scripts/validateCommitMessage.js {1}

    - name: commit message
      run: npx commitlint --edit {1}
